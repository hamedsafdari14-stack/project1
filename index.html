<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signal Desk — AI Crypto Trading Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js"></script>
<style>
  :root{
    --bg: #080B10;
    --panel: #10141C;
    --panel-2: #141924;
    --border: #1E2531;
    --border-soft: #171D28;
    --text: #E7EAF0;
    --text-dim: #7E8798;
    --text-faint: #4B5468;
    --bull: #2FD67B;
    --bull-dim: #16321F;
    --bear: #FF5C6C;
    --bear-dim: #35181C;
    --wait: #F2B84B;
    --wait-dim: #332510;
    --accent: #5B8CFF;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  .mono{ font-family:'JetBrains Mono',monospace; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  .app{ max-width:1440px; margin:0 auto; padding:20px 24px 60px; }

  /* ---- topbar ---- */
  .topbar{ display:flex; align-items:center; gap:20px; padding-bottom:20px;
    border-bottom:1px solid var(--border-soft); margin-bottom:20px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{ width:30px; height:30px; border-radius:7px;
    background:linear-gradient(135deg,var(--accent),#8B5CFF);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; }
  .brand h1{ font-size:16px; font-weight:700; margin:0; letter-spacing:.2px; }
  .brand span{ font-size:11px; color:var(--text-dim); display:block; margin-top:1px; }

  .search-wrap{ flex:1; min-width:240px; max-width:420px; position:relative; }
  .search-wrap input{ width:100%; background:var(--panel); border:1px solid var(--border);
    color:var(--text); padding:10px 14px; border-radius:9px; font-size:14px; outline:none;
    transition:border-color .15s; }
  .search-wrap input:focus{ border-color:var(--accent); }
  .search-wrap input::placeholder{ color:var(--text-faint); }
  .suggest{ position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--panel-2);
    border:1px solid var(--border); border-radius:9px; overflow:hidden; z-index:40; display:none; }
  .suggest div{ padding:9px 13px; font-size:13px; cursor:pointer; display:flex; justify-content:space-between; }
  .suggest div:hover{ background:var(--border-soft); }
  .suggest .sym{ color:var(--text-dim); }

  .timeframes{ display:flex; gap:4px; background:var(--panel); padding:4px; border-radius:9px; border:1px solid var(--border); }
  .timeframes button{ background:transparent; border:none; color:var(--text-dim); font-size:12px;
    font-family:'JetBrains Mono',monospace; padding:6px 10px; border-radius:6px; cursor:pointer; }
  .timeframes button.active{ background:var(--border-soft); color:var(--text); }

  .go-btn{ background:var(--accent); color:#fff; border:none; padding:10px 18px; border-radius:9px;
    font-size:13px; font-weight:600; cursor:pointer; }
  .go-btn:disabled{ opacity:.5; cursor:default; }

  /* ---- status / empty ---- */
  .status{ text-align:center; padding:80px 20px; color:var(--text-dim); }
  .status .big{ font-size:15px; margin-bottom:6px; color:var(--text); }
  .err{ background:var(--bear-dim); border:1px solid #532228; color:#FFB3BA; padding:14px 16px;
    border-radius:10px; font-size:13px; margin-bottom:18px; }

  /* ---- layout ---- */
  .grid{ display:grid; grid-template-columns: 1fr 340px; gap:18px; }
  @media (max-width:980px){ .grid{ grid-template-columns:1fr; } }

  .panel{ background:var(--panel); border:1px solid var(--border-soft); border-radius:12px; padding:16px; }
  .panel h3{ margin:0 0 14px; font-size:12px; text-transform:none; letter-spacing:.3px;
    color:var(--text-dim); font-weight:600; }

  .coin-head{ display:flex; align-items:baseline; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .coin-head img{ width:28px; height:28px; border-radius:50%; vertical-align:middle; margin-right:4px; }
  .coin-head h2{ font-size:20px; margin:0; font-weight:700; }
  .coin-head .px{ font-size:24px; font-weight:700; font-family:'JetBrains Mono',monospace; }
  .pct{ font-size:13px; font-family:'JetBrains Mono',monospace; padding:2px 8px; border-radius:6px; }
  .pct.up{ color:var(--bull); background:var(--bull-dim); }
  .pct.down{ color:var(--bear); background:var(--bear-dim); }

  #chart{ width:100%; height:420px; }

  /* ---- executive summary card ---- */
  .signal-badge{ display:inline-flex; align-items:center; gap:8px; padding:9px 14px; border-radius:9px;
    font-weight:700; font-size:14px; letter-spacing:.3px; width:100%; justify-content:center; }
  .signal-badge.buy{ background:var(--bull-dim); color:var(--bull); border:1px solid #1F5138; }
  .signal-badge.sell{ background:var(--bear-dim); color:var(--bear); border:1px solid #5A2731; }
  .signal-badge.wait{ background:var(--wait-dim); color:var(--wait); border:1px solid #5A431A; }

  .conf-row{ margin-top:14px; }
  .conf-label{ display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); margin-bottom:6px; }
  .conf-bar{ height:7px; border-radius:4px; background:var(--border-soft); overflow:hidden; }
  .conf-fill{ height:100%; border-radius:4px; }

  .kv-list{ margin-top:16px; display:flex; flex-direction:column; gap:10px; }
  .kv{ display:flex; justify-content:space-between; align-items:center; font-size:13px; }
  .kv .k{ color:var(--text-dim); }
  .kv .v{ font-family:'JetBrains Mono',monospace; font-weight:600; }
  .kv .v.bull{ color:var(--bull); }
  .kv .v.bear{ color:var(--bear); }
  .divider{ height:1px; background:var(--border-soft); margin:14px 0; }

  .tps{ display:flex; flex-direction:column; gap:6px; margin-top:6px; }
  .tp-row{ display:flex; justify-content:space-between; font-size:12.5px; font-family:'JetBrains Mono',monospace;
    padding:6px 10px; background:var(--panel-2); border-radius:7px; border:1px solid var(--border-soft); }

  /* ---- tabs ---- */
  .tabs{ display:flex; gap:4px; margin:22px 0 14px; border-bottom:1px solid var(--border-soft); }
  .tab-btn{ background:transparent; border:none; color:var(--text-dim); padding:10px 16px; font-size:13px;
    font-weight:600; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab-btn.active{ color:var(--text); border-bottom-color:var(--accent); }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  .ind-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
  .ind-card{ background:var(--panel-2); border:1px solid var(--border-soft); border-radius:10px; padding:12px 14px; }
  .ind-card .lbl{ font-size:11px; color:var(--text-dim); margin-bottom:5px; }
  .ind-card .val{ font-size:16px; font-weight:700; font-family:'JetBrains Mono',monospace; }

  .driver-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .driver-list li{ font-size:13.5px; line-height:1.5; padding-left:18px; position:relative; color:#C9CFDB; }
  .driver-list li::before{ content:'—'; position:absolute; left:0; color:var(--accent); }

  .news-item{ padding:12px 0; border-bottom:1px solid var(--border-soft); }
  .news-item:last-child{ border-bottom:none; }
  .news-item a{ color:var(--text); text-decoration:none; font-size:13.5px; font-weight:500; }
  .news-item a:hover{ color:var(--accent); }
  .news-meta{ display:flex; gap:8px; align-items:center; margin-top:5px; font-size:11px; color:var(--text-dim); }
  .tag{ font-size:10.5px; padding:2px 7px; border-radius:5px; font-weight:600; }
  .tag.Positive{ background:var(--bull-dim); color:var(--bull); }
  .tag.Negative{ background:var(--bear-dim); color:var(--bear); }
  .tag.Neutral{ background:var(--border-soft); color:var(--text-dim); }

  .risk-row{ display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border-soft); font-size:13px; }
  .risk-row:last-child{ border-bottom:none; }

  .disclaimer{ margin-top:22px; font-size:11.5px; color:var(--text-faint); line-height:1.6;
    border-top:1px solid var(--border-soft); padding-top:14px; }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <div class="mark">S</div>
      <div><h1>Signal Desk</h1><span>AI-assisted technical &amp; sentiment analysis</span></div>
    </div>

    <div class="search-wrap">
      <input id="symbolInput" type="text" placeholder="Search a symbol — SOL, BTC, ETH…" autocomplete="off" />
      <div class="suggest" id="suggestBox"></div>
    </div>

    <div class="timeframes" id="timeframes">
      <button data-days="7">7D</button>
      <button data-days="30" class="active">30D</button>
      <button data-days="90">90D</button>
      <button data-days="365">1Y</button>
    </div>

    <button class="go-btn" id="analyzeBtn">Analyze</button>
  </div>

  <div id="root">
    <div class="status">
      <div class="big">Search any crypto asset to generate a signal</div>
      <div>Real-time price &amp; technicals via CoinGecko · Rule-based multi-indicator confluence scoring</div>
    </div>
  </div>

</div>

<script>
const API_BASE = window.SIGNAL_DESK_API_BASE || 'http://localhost:8000';
let chart, candleSeries, priceLines = [];
let currentDays = 30;
let debounceTimer;

const root = document.getElementById('root');
const symbolInput = document.getElementById('symbolInput');
const suggestBox = document.getElementById('suggestBox');
const analyzeBtn = document.getElementById('analyzeBtn');
const timeframesEl = document.getElementById('timeframes');

timeframesEl.addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  [...timeframesEl.children].forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  currentDays = parseInt(e.target.dataset.days, 10);
  if (symbolInput.value.trim()) runAnalysis(symbolInput.value.trim());
});

analyzeBtn.addEventListener('click', () => {
  const v = symbolInput.value.trim();
  if (v) runAnalysis(v);
});
symbolInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { suggestBox.style.display = 'none'; runAnalysis(symbolInput.value.trim()); }
});
symbolInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const q = symbolInput.value.trim();
  if (q.length < 2) { suggestBox.style.display = 'none'; return; }
  debounceTimer = setTimeout(() => fetchSuggestions(q), 300);
});
document.addEventListener('click', (e) => {
  if (!suggestBox.contains(e.target) && e.target !== symbolInput) suggestBox.style.display = 'none';
});

async function fetchSuggestions(q) {
  try {
    const res = await fetch(`${API_BASE}/api/resolve?symbol=${encodeURIComponent(q)}`);
    if (!res.ok) { suggestBox.style.display = 'none'; return; }
    const coin = await res.json();
    suggestBox.innerHTML = `<div data-id="${coin.symbol}"><span>${coin.name}</span><span class="sym">${coin.symbol}</span></div>`;
    suggestBox.style.display = 'block';
    suggestBox.querySelector('div').addEventListener('click', () => {
      symbolInput.value = coin.symbol;
      suggestBox.style.display = 'none';
      runAnalysis(coin.symbol);
    });
  } catch { suggestBox.style.display = 'none'; }
}

function fmtNum(n, opts = {}) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  const { decimals } = opts;
  if (decimals !== undefined) return Number(n).toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  const abs = Math.abs(n);
  const d = abs >= 100 ? 2 : abs >= 1 ? 4 : 8;
  return Number(n).toLocaleString(undefined, { maximumFractionDigits: d });
}
function fmtCompact(n) {
  if (n === null || n === undefined) return '—';
  return new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 2 }).format(n);
}
function fmtPct(n) {
  if (n === null || n === undefined) return '—';
  return (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
}

async function runAnalysis(symbol) {
  root.innerHTML = `<div class="status"><div class="big">Analyzing ${symbol.toUpperCase()}…</div><div>Fetching live market data, computing indicators, scanning news</div></div>`;
  analyzeBtn.disabled = true;
  try {
    const res = await fetch(`${API_BASE}/api/analyze?symbol=${encodeURIComponent(symbol)}&days=${currentDays}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Request failed');
    render(data);
  } catch (err) {
    root.innerHTML = `<div class="err">Couldn't generate a signal: ${err.message}</div>
      <div class="status">Try a different symbol, or check that the backend is running at ${API_BASE}.</div>`;
  } finally {
    analyzeBtn.disabled = false;
  }
}

function render(data) {
  const { coin, market, candles, indicators, trend, support_resistance, sentiment, signal, disclaimer } = data;
  const sigClass = signal.signal.startsWith('BUY') ? 'buy' : signal.signal.startsWith('SELL') ? 'sell' : 'wait';
  const sigColor = sigClass === 'buy' ? 'var(--bull)' : sigClass === 'sell' ? 'var(--bear)' : 'var(--wait)';
  const pxChangeClass = (market.price_change_pct_24h ?? 0) >= 0 ? 'up' : 'down';

  root.innerHTML = `
    <div class="grid">
      <div>
        <div class="panel">
          <div class="coin-head">
            ${coin.thumb ? `<img src="${coin.thumb}" alt="">` : ''}
            <h2>${coin.name} <span style="color:var(--text-dim);font-weight:500;">${coin.symbol}</span></h2>
            <div class="px">$${fmtNum(market.current_price)}</div>
            <div class="pct ${pxChangeClass}">${fmtPct(market.price_change_pct_24h)} · 24h</div>
          </div>
          <div id="chart"></div>
        </div>

        <div class="tabs">
          <button class="tab-btn active" data-tab="technical">Technical Breakdown</button>
          <button class="tab-btn" data-tab="news">News &amp; Fundamentals</button>
          <button class="tab-btn" data-tab="risk">Risk Assessment</button>
        </div>

        <div class="tab-panel active" id="tab-technical">
          <div class="panel" style="margin-bottom:14px;">
            <h3>KEY DRIVERS</h3>
            <ul class="driver-list">${signal.key_drivers.map(d => `<li>${d}</li>`).join('')}</ul>
          </div>
          <div class="panel">
            <h3>INDICATORS (LATEST)</h3>
            <div class="ind-grid">
              ${indCard('EMA 20', fmtNum(indicators.ema20))}
              ${indCard('EMA 50', fmtNum(indicators.ema50))}
              ${indCard('EMA 200', fmtNum(indicators.ema200))}
              ${indCard('RSI (14)', fmtNum(indicators.rsi14, {decimals:1}))}
              ${indCard('MACD', fmtNum(indicators.macd, {decimals:4}))}
              ${indCard('MACD Signal', fmtNum(indicators.macd_signal, {decimals:4}))}
              ${indCard('Stoch %K', fmtNum(indicators.stoch_k, {decimals:1}))}
              ${indCard('Stoch %D', fmtNum(indicators.stoch_d, {decimals:1}))}
              ${indCard('BB Upper', fmtNum(indicators.bb_upper))}
              ${indCard('BB Lower', fmtNum(indicators.bb_lower))}
              ${indCard('ATR (14)', fmtNum(indicators.atr14))}
              ${indCard('Structure', trend.structure)}
            </div>
          </div>
        </div>

        <div class="tab-panel" id="tab-news">
          <div class="panel">
            <h3>SENTIMENT — ${sentiment.overall_sentiment.toUpperCase()} <span style="color:var(--text-faint);font-weight:400;">(${sentiment.source})</span></h3>
            ${sentiment.articles.length === 0
              ? `<div style="color:var(--text-dim);font-size:13px;">${sentiment.note || 'No recent coin-specific articles found.'}</div>`
              : sentiment.articles.map(a => `
                <div class="news-item">
                  <a href="${a.url}" target="_blank" rel="noopener">${a.title}</a>
                  <div class="news-meta">
                    <span class="tag ${a.sentiment}">${a.sentiment}</span>
                    <span>${a.source}</span>
                  </div>
                </div>`).join('')}
          </div>
        </div>

        <div class="tab-panel" id="tab-risk">
          <div class="panel">
            <h3>RISK ASSESSMENT</h3>
            <div class="risk-row"><span>Volatility (ATR 14)</span><span class="mono">${fmtNum(signal.atr14)}</span></div>
            <div class="risk-row"><span>Required minimum R:R</span><span class="mono">1 : ${signal.min_required_rrr}</span></div>
            <div class="risk-row"><span>Achieved R:R</span><span class="mono">${signal.risk_reward_ratio ? '1 : ' + signal.risk_reward_ratio : '—'}</span></div>
            <div class="risk-row"><span>Confluence score (raw)</span><span class="mono">${signal.raw_score}</span></div>
            <div class="risk-row"><span>Nearest support</span><span class="mono">${support_resistance.support[0] ? fmtNum(support_resistance.support[0]) : '—'}</span></div>
            <div class="risk-row"><span>Nearest resistance</span><span class="mono">${support_resistance.resistance[0] ? fmtNum(support_resistance.resistance[0]) : '—'}</span></div>
            <div class="risk-row"><span>Market cap rank</span><span class="mono">#${market.market_cap_rank ?? '—'}</span></div>
            <div class="risk-row"><span>24h volume</span><span class="mono">$${fmtCompact(market.total_volume)}</span></div>
          </div>
        </div>

        <div class="disclaimer">${disclaimer}</div>
      </div>

      <div>
        <div class="panel">
          <h3>EXECUTIVE SUMMARY</h3>
          <div class="signal-badge ${sigClass}">${signal.signal}</div>

          <div class="conf-row">
            <div class="conf-label"><span>AI Confidence</span><span class="mono">${signal.confidence_pct}%</span></div>
            <div class="conf-bar"><div class="conf-fill" style="width:${signal.confidence_pct}%;background:${sigColor};"></div></div>
          </div>

          <div class="kv-list">
            <div class="kv"><span class="k">Entry</span><span class="v">${signal.entry_range ? `$${fmtNum(signal.entry_range[0])} – $${fmtNum(signal.entry_range[1])}` : '—'}</span></div>
            <div class="kv"><span class="k">Stop Loss</span><span class="v bear">${signal.stop_loss ? '$' + fmtNum(signal.stop_loss) : '—'}</span></div>
            <div class="kv"><span class="k">Risk : Reward</span><span class="v">${signal.risk_reward_ratio ? '1 : ' + signal.risk_reward_ratio : '—'}</span></div>
          </div>

          <div class="divider"></div>
          <div style="font-size:11px;color:var(--text-dim);margin-bottom:8px;">TAKE PROFIT TARGETS</div>
          <div class="tps">
            ${signal.take_profits.length ? signal.take_profits.map((tp, i) => `
              <div class="tp-row"><span>TP${i+1}</span><span class="bull" style="color:var(--bull);">$${fmtNum(tp)}</span></div>
            `).join('') : `<div style="font-size:12.5px;color:var(--text-faint);">No trade — targets withheld</div>`}
          </div>

          <div class="divider"></div>
          <div style="font-size:11px;color:var(--text-dim);margin-bottom:8px;">MARKET SNAPSHOT</div>
          <div class="kv-list">
            <div class="kv"><span class="k">Market Cap</span><span class="v">$${fmtCompact(market.market_cap)}</span></div>
            <div class="kv"><span class="k">24h Volume</span><span class="v">$${fmtCompact(market.total_volume)}</span></div>
            <div class="kv"><span class="k">7d Change</span><span class="v ${(market.price_change_pct_7d ?? 0) >= 0 ? 'bull' : 'bear'}">${fmtPct(market.price_change_pct_7d)}</span></div>
            <div class="kv"><span class="k">All-Time High</span><span class="v">$${fmtNum(market.ath)}</span></div>
          </div>
        </div>
      </div>
    </div>
  `;

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
    });
  });

  drawChart(candles, signal, support_resistance);
}

function indCard(label, value) {
  return `<div class="ind-card"><div class="lbl">${label}</div><div class="val">${value}</div></div>`;
}

function drawChart(candles, signal, sr) {
  const el = document.getElementById('chart');
  el.innerHTML = '';
  chart = LightweightCharts.createChart(el, {
    layout: { background: { color: 'transparent' }, textColor: '#7E8798', fontFamily: "'JetBrains Mono', monospace" },
    grid: { vertLines: { color: '#151B26' }, horzLines: { color: '#151B26' } },
    rightPriceScale: { borderColor: '#1E2531' },
    timeScale: { borderColor: '#1E2531', timeVisible: true },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    width: el.clientWidth,
    height: 420,
  });

  candleSeries = chart.addCandlestickSeries({
    upColor: '#2FD67B', downColor: '#FF5C6C',
    borderUpColor: '#2FD67B', borderDownColor: '#FF5C6C',
    wickUpColor: '#2FD67B', wickDownColor: '#FF5C6C',
  });
  candleSeries.setData(candles);

  const addLine = (price, color, title) => {
    if (price === null || price === undefined) return;
    candleSeries.createPriceLine({ price, color, lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title });
  };

  if (signal.entry_price) addLine(signal.entry_price, '#5B8CFF', 'Entry');
  if (signal.stop_loss) addLine(signal.stop_loss, '#FF5C6C', 'SL');
  (signal.take_profits || []).forEach((tp, i) => addLine(tp, '#2FD67B', `TP${i + 1}`));
  (sr.resistance || []).slice(0, 2).forEach(r => addLine(r, '#F2B84B', 'R'));
  (sr.support || []).slice(0, 2).forEach(s => addLine(s, '#3C4557', 'S'));

  chart.timeScale().fitContent();

  window.addEventListener('resize', () => {
    if (chart) chart.applyOptions({ width: el.clientWidth });
  });
}
</script>
</body>
</html>
